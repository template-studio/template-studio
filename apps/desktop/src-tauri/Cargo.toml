[package]
name = "desktop"
version = "0.1.0"
description = "Template Studio - A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# 数据库
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "mysql", "postgres"] }

# SQL解析
sqlparser = "0.51"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# 文件处理
zip = "2.2"

# YAML 序列化
serde_yaml = "0.9"

# 目录工具
dirs = "5.0"

# Workspace 依赖
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

# 内部依赖
template_studio_template_core = { path = "../../../crates/template_core" }
# template_studio_shared = { path = "../../../crates/shared" }  # 暂时注释，等需要时再启用


aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
