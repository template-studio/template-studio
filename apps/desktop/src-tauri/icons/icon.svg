<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 主渐变：蓝紫色 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>

    <!-- 高光渐变 -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 闪电渐变 -->
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>

    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- 高光效果 -->
  <rect x="32" y="32" width="448" height="224" rx="96" ry="96" fill="url(#highlightGradient)" opacity="0.5"/>

  <!-- 代码括号 < -->
  <g fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左括号 < -->
    <path d="M 140 180 L 80 256 L 140 332" opacity="0.95"/>

    <!-- 右括号 > -->
    <path d="M 372 180 L 432 256 L 372 332" opacity="0.95"/>

    <!-- 斜杠 / -->
    <path d="M 300 160 L 212 352" stroke-width="28" opacity="0.9"/>
  </g>

  <!-- 闪电符号（表示生成/快速） -->
  <path d="M 276 100 L 236 200 L 276 200 L 256 280 L 316 170 L 276 170 Z"
        fill="url(#boltGradient)"
        filter="url(#shadow)"
        transform="translate(120, 40) scale(0.9)"/>

  <!-- 装饰点 -->
  <circle cx="120" cy="120" r="12" fill="white" opacity="0.6"/>
  <circle cx="400" cy="400" r="16" fill="white" opacity="0.4"/>
  <circle cx="380" cy="100" r="8" fill="white" opacity="0.5"/>
</svg>
