<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeGen Studio - 图标预览与导出</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 32px;
      background: linear-gradient(90deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .preview-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
    }

    .preview-section h2 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #a0a0a0;
    }

    .icon-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .icon-item canvas {
      border-radius: 20%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .icon-item .size {
      font-size: 14px;
      color: #888;
    }

    .icon-item button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      font-size: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .icon-item button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .download-all {
      display: block;
      width: 200px;
      margin: 30px auto 0;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .download-all:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .instructions {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      margin-top: 30px;
    }

    .instructions h3 {
      margin-bottom: 15px;
      color: #667eea;
    }

    .instructions ol {
      padding-left: 20px;
      line-height: 1.8;
    }

    .instructions code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 CodeGen Studio 图标预览</h1>

    <div class="preview-section">
      <h2>图标预览</h2>
      <div class="icon-grid" id="iconGrid"></div>
      <button class="download-all" onclick="downloadAll()">📦 下载全部 PNG</button>
    </div>

    <div class="instructions">
      <h3>📝 使用说明</h3>
      <ol>
        <li>点击各尺寸下方的按钮下载单独的 PNG 文件</li>
        <li>或点击"下载全部 PNG"批量下载</li>
        <li>将下载的图标放入 <code>src-tauri/icons/</code> 目录</li>
        <li>
          Windows ICO：使用 <a href="https://www.xiconeditor.com/" target="_blank" style="color:#667eea">xiconeditor.com</a>
          上传 256x256.png 生成
        </li>
        <li>
          macOS ICNS：使用 <a href="https://iconifier.net/" target="_blank" style="color:#667eea">iconifier.net</a>
          上传 512x512.png 生成
        </li>
      </ol>
    </div>
  </div>

  <script>
    const SIZES = [32, 64, 128, 256, 512];

    // SVG 图标内容
    const svgContent = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="50%" style="stop-color:#764ba2"/>
            <stop offset="100%" style="stop-color:#f093fb"/>
          </linearGradient>
          <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700"/>
            <stop offset="100%" style="stop-color:#ff8c00"/>
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
          </filter>
        </defs>

        <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)" filter="url(#shadow)"/>

        <rect x="32" y="32" width="448" height="224" rx="96" ry="96" fill="rgba(255,255,255,0.15)"/>

        <g fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 140 180 L 80 256 L 140 332" opacity="0.95"/>
          <path d="M 372 180 L 432 256 L 372 332" opacity="0.95"/>
          <path d="M 300 160 L 212 352" stroke-width="28" opacity="0.9"/>
        </g>

        <path d="M 276 100 L 236 200 L 276 200 L 256 280 L 316 170 L 276 170 Z"
              fill="url(#boltGradient)"
              filter="url(#shadow)"
              transform="translate(120, 40) scale(0.9)"/>

        <circle cx="120" cy="120" r="12" fill="white" opacity="0.6"/>
        <circle cx="400" cy="400" r="16" fill="white" opacity="0.4"/>
        <circle cx="380" cy="100" r="8" fill="white" opacity="0.5"/>
      </svg>
    `;

    const iconGrid = document.getElementById('iconGrid');
    const canvases = {};

    // 创建各尺寸图标
    SIZES.forEach(size => {
      const item = document.createElement('div');
      item.className = 'icon-item';

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.style.width = Math.min(size, 128) + 'px';
      canvas.style.height = Math.min(size, 128) + 'px';

      const sizeLabel = document.createElement('div');
      sizeLabel.className = 'size';
      sizeLabel.textContent = `${size} × ${size}`;

      const btn = document.createElement('button');
      btn.textContent = '下载 PNG';
      btn.onclick = () => downloadIcon(size);

      item.appendChild(canvas);
      item.appendChild(sizeLabel);
      item.appendChild(btn);
      iconGrid.appendChild(item);

      canvases[size] = canvas;
    });

    // 渲染 SVG 到 Canvas
    function renderIcons() {
      SIZES.forEach(size => {
        const canvas = canvases[size];
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const svgBlob = new Blob([svgContent], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
        };
        img.src = url;
      });
    }

    // 下载单个图标
    function downloadIcon(size) {
      const canvas = canvases[size];
      const link = document.createElement('a');
      link.download = size === 256 ? '128x128@2x.png' : `${size}x${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 下载全部
    function downloadAll() {
      SIZES.forEach((size, index) => {
        setTimeout(() => {
          downloadIcon(size);
        }, index * 300);
      });
    }

    // 初始化
    renderIcons();
  </script>
</body>
</html>
