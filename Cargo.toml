[workspace]
members = [
    "apps/web",
    "apps/cli",
    "apps/scaffold-desktop/src-tauri",
    "apps/codegen-desktop/src-tauri",
    "crates/shared",
    "crates/infrastructure",
    "crates/repositories",
    "crates/services",
    "crates/template_core",
    "crates/template_core_wasm",
]
resolver = "2"

[workspace.dependencies]
# Web框架
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "sqlite", "chrono", "uuid", "macros"], default-features = false }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 模板引擎
tera = "1.19"

# Git操作
git2 = "0.18"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
config = "0.14"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 文件处理
zip = "0.6"
bytes = "1.5"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"

# 异步
futures = "0.3"

# 验证
validator = { version = "0.16", features = ["derive"] }

# 正则表达式
regex = "1.10"

# 性能优化
lru = "0.12"
rayon = "1.10"
