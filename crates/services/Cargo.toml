[package]
name = "template-studio-services"
version = "0.1.0"
edition = "2021"

[dependencies]
template-studio-shared = { path = "../shared" }
template-studio-repositories = { path = "../repositories" }
template-studio-infrastructure = { path = "../infrastructure" }
template_studio_template_core = { path = "../template_core" }

sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }
tera = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
base64 = "0.22"
percent-encoding = "2.3"
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
validator = { workspace = true, features = ["derive"] }
rand = "0.8"