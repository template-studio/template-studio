[package]
name = "template-studio-template-core-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Template Studio Team"]
description = "Template Studio Template Core WASM bindings - Browser-side template rendering"
license = "MIT"
repository = "https://github.com/your-org/template_studio_rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 核心模板引擎
template_studio_template_core = { path = "../template_core", default-features = false }

# WASM 绑定
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# 错误处理
thiserror = "1.0"

# 日志（WASM 友好）
console_log = { version = "1.0", optional = true }
log = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_log"]
console_log = ["dep:console_log"]

[profile.release]
# 优化设置
opt-level = 3
lto = true
# 减小 WASM 体积
panic = "abort"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
